hostname = *burn-chatfiles.bldimg.com, *burn-chatfiles.bldimg.cn, *burnchatfiles*.bldimg.com, *burnchatfiles*.bldimg.cn, argo.blued.cn, social.blued.cn, social.irisgw.cn, moments.irisgw.cn, voice.irisgw.cn

# 广告拦截规则
^https://(?:argo\.blued\.cn|moments\.irisgw\.cn)/blued/(?:promote.*|adms/.*|splash.*|launch/adms(?:\?.*)?|promotion/banners(?:\?.*)?|floats(?:\?.*)?|api/ad/distribution(?:\?.*)?)$ url reject
^https://(?:social\.blued\.cn|social\.irisgw\.cn)/users/.*/joy(?:\?.*)?$ url reject
^https://(?:social\.blued\.cn|social\.irisgw\.cn)/users/(?:recommend|selection)(?:\?.*)?$ url reject
^https://voice\.irisgw\.cn/users/chatroom.* url reject
^https://social\.irisgw\.cn/voice-chat/api/.* url reject

# Blued闪照①
^https:\/\/(burn-chatfiles)\.bldimg\.(com|cn)\/.*\/(ingfiles|burn_chatfiles\/(videos|users))\/.* url script-response-body https://raw.githubusercontent.com/HerbertGao/Scripts/dev/Scripts/Blued/blued.js
# Blued闪照②
^https:\/\/.*burnchatfiles.*\.bldimg\.(com|cn)\/burn_chatfiles\/(users|videos)\/.* url script-response-body https://raw.githubusercontent.com/HerbertGao/Scripts/dev/Scripts/Blued/blued.js
# Blued资料卡片
^https:\/\/(?:argo\.blued\.cn|social\.irisgw\.cn)\/users\/\d+(\?|$) url script-response-body https://raw.githubusercontent.com/HerbertGao/Scripts/dev/Scripts/Blued/blued.profile.js