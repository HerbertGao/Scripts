name: Update Env

on:
  schedule:
    # 每周一 02:00 北京时间(UTC 周日 18:00)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-env
  cancel-in-progress: false

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Env from upstream
        run: node tools/update-env.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- Scripts/; then
            echo "Env 已是最新,无变更。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Scripts/
          git commit -m "chore(env): 同步 chavyleung/scripts 的 Env"
          git push
